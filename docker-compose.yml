version: '3.8'

services:
  backend:
    build: ./backend

  frontend:
    image: python:3.10
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: python3 -m http.server 5500

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: movieflix
    ports:
      - "5432:5432"