name: CI MovieFlix

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t movieflix-backend ./backend

    - name: Test container
      run: |
        docker run -d -p 3000:3000 --name test movieflix-backend
        sleep 5
        curl -f http://localhost:3000/movies || exit 1

    - name: Login Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Push image
      run: |
        docker tag movieflix-backend ${{ secrets.DOCKER_USERNAME }}/movieflix-backend
        docker push ${{ secrets.DOCKER_USERNAME }}/movieflix-backend